<!DOCTYPE html>
<html>
<head>
    <style>

        #canvas {
            border: 1px solid #000;
            background: #1a1a1a;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="800" height="600"></canvas>
    <script>
        // this was edited with cursor editor
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Refined parameters for stability
        const INITIAL_PARTICLE_COUNT = 500;
        const MAX_PARTICLES = 5000;
        const SMOOTHING_LENGTH = 20;
        const PARTICLE_MASS = 1.0;
        const REST_DENSITY = 2.0;
        const PRESSURE_CONSTANT = 50;
        const VISCOSITY = 0.18;
        const GRAVITY = 8.3;
        const BOUNDARY_DAMPING = -0.5;
        const PARTICLE_RADIUS = 4;
        const SURFACE_TENSION = 0.05;
        const MAX_VELOCITY = 10; // Added velocity cap
        
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.density = 0;
                this.pressure = 0;
                this.fx = 0;
                this.fy = 0;
                this.surfaceNormalX = 0;
                this.surfaceNormalY = 0;
                this.colorIntensity = 1;
            }

            // Added method to limit velocity
            limitVelocity() {
                const velocitySquared = this.vx * this.vx + this.vy * this.vy;
                if (velocitySquared > MAX_VELOCITY * MAX_VELOCITY) {
                    const scale = MAX_VELOCITY / Math.sqrt(velocitySquared);
                    this.vx *= scale;
                    this.vy *= scale;
                }
            }
        }
        
        const particles = [];
        
        // Modified particle creation for more stability
        function createParticle(x, y, velocityX = 0, velocityY = 0) {
            if (particles.length < MAX_PARTICLES) {
                const particle = new Particle(x, y);
                // Limit initial velocities
                particle.vx = Math.min(Math.max(velocityX, -3), 3);
                particle.vy = Math.min(Math.max(velocityY, -3), 3);
                particles.push(particle);
            }
        }
        
        // Initialize particles
        for (let i = 0; i < INITIAL_PARTICLE_COUNT; i++) {
            const x = canvas.width * 0.5 + (Math.random() - 0.5) * 200;
            const y = canvas.height * 0.3 + (Math.random() - 0.5) * 200;
            createParticle(x, y);
        }
        
        let mouseX = 0;
        let mouseY = 0;
        let mousePressed = false;
        let lastEmitTime = 0;
        
        function calculateDensityPressure() {
            for (const particle of particles) {
                particle.density = 0;
                
                for (const neighbor of particles) {
                    const dx = neighbor.x - particle.x;
                    const dy = neighbor.y - particle.y;
                    const r2 = dx * dx + dy * dy;
                    
                    if (r2 < SMOOTHING_LENGTH * SMOOTHING_LENGTH) {
                        const r = Math.sqrt(r2);
                        const kernel = Math.max(0, (1 - r / SMOOTHING_LENGTH) ** 3);
                        particle.density += PARTICLE_MASS * kernel;
                    }
                }
                
                // Ensure minimum density to prevent instability
                particle.density = Math.max(particle.density, REST_DENSITY * 0.5);
                particle.pressure = PRESSURE_CONSTANT * (particle.density - REST_DENSITY);
            }
        }
        
        function calculateForces() {
            for (const particle of particles) {
                particle.fx = 0;
                particle.fy = GRAVITY;
                
                for (const neighbor of particles) {
                    if (particle === neighbor) continue;
                    
                    const dx = neighbor.x - particle.x;
                    const dy = neighbor.y - particle.y;
                    const r2 = dx * dx + dy * dy;
                    
                    if (r2 < SMOOTHING_LENGTH * SMOOTHING_LENGTH && r2 > 0.01) {
                        const r = Math.sqrt(r2);
                        const kernel = (1 - r / SMOOTHING_LENGTH) ** 3;
                        
                        // Pressure force with stability improvements
                        const pressureForce = PARTICLE_MASS * 
                            (particle.pressure + neighbor.pressure) / 
                            (2 * Math.max(neighbor.density, REST_DENSITY * 0.5)) * kernel;
                        
                        const forceX = -pressureForce * dx / r;
                        const forceY = -pressureForce * dy / r;
                        
                        // Limit maximum force to prevent explosions
                        const forceMagnitude = Math.sqrt(forceX * forceX + forceY * forceY);
                        const maxForce = 5;
                        if (forceMagnitude > maxForce) {
                            const scale = maxForce / forceMagnitude;
                            particle.fx += forceX * scale;
                            particle.fy += forceY * scale;
                        } else {
                            particle.fx += forceX;
                            particle.fy += forceY;
                        }
                        
                        // Viscosity
                        const viscosityForce = VISCOSITY * PARTICLE_MASS / 
                            neighbor.density * kernel;
                        particle.fx += (neighbor.vx - particle.vx) * viscosityForce;
                        particle.fy += (neighbor.vy - particle.vy) * viscosityForce;
                    }
                }
            }
        }
        
        function integrate(dt) {
            for (const particle of particles) {
                // Update velocities with limited forces
                const maxForce = 10;
                const forceMagnitude = Math.sqrt(particle.fx * particle.fx + particle.fy * particle.fy);
                if (forceMagnitude > maxForce) {
                    const scale = maxForce / forceMagnitude;
                    particle.fx *= scale;
                    particle.fy *= scale;
                }

                particle.vx += particle.fx * dt;
                particle.vy += particle.fy * dt;
                
                // Limit velocity
                particle.limitVelocity();
                
                // Update position
                particle.x += particle.vx * dt;
                particle.y += particle.vy * dt;
                
                // Boundary conditions with smoothing
                if (particle.x < PARTICLE_RADIUS) {
                    particle.vx *= BOUNDARY_DAMPING;
                    particle.x = PARTICLE_RADIUS;
                }
                if (particle.x > canvas.width - PARTICLE_RADIUS) {
                    particle.vx *= BOUNDARY_DAMPING;
                    particle.x = canvas.width - PARTICLE_RADIUS;
                }
                if (particle.y < PARTICLE_RADIUS) {
                    particle.vy *= BOUNDARY_DAMPING;
                    particle.y = PARTICLE_RADIUS;
                }
                if (particle.y > canvas.height - PARTICLE_RADIUS) {
                    particle.vy *= BOUNDARY_DAMPING;
                    particle.y = canvas.height - PARTICLE_RADIUS;
                }
            }
        }
        
        // Modified particle emission for stability
        function emitParticles() {
            if (mousePressed && Date.now() - lastEmitTime > 50) {
                for (let i = 0; i < 30; i++) {
                    const angle = Math.random() * Math.PI * 0.5 - Math.PI * 0.25;
                    const speed = 1 + Math.random();
                    createParticle(
                        mouseX + (Math.random() - 0.5) * 6,
                        mouseY + (Math.random() - 0.5) * 6,
                        Math.cos(angle) * speed,
                        Math.sin(angle) * speed + 1 // Slight downward bias
                    );
                }
                lastEmitTime = Date.now();
            }
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (const particle of particles) {
                const intensity = Math.floor(180 + particle.colorIntensity * 75);
                ctx.fillStyle = `rgba(74, 158, 255, ${0.6 + particle.colorIntensity * 0.4})`;
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, PARTICLE_RADIUS, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function update() {
            emitParticles();
            calculateDensityPressure();
            calculateForces();
            integrate(0.16);
            draw(); 
            requestAnimationFrame(update);
        }
        
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });
        
        canvas.addEventListener('mousedown', () => {
            mousePressed = true;
        });
        
        canvas.addEventListener('mouseup', () => {
            mousePressed = false;
        });
        
        canvas.addEventListener('mouseleave', () => {
            mousePressed = false;
        }); 
        
        update();
    </script>
</body>
</html>
